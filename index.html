<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelQuest</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      background: #111;
      color: #33ff66;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 100vh;
    }

    header {
      padding: 2rem 1rem 1rem;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
    }

    canvas {
      border: 3px solid #33ff66;
      margin: 2rem 0;
    }

    .btn {
      background: #33ff66;
      color: #111;
      padding: 1rem 2rem;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }

    .section {
      max-width: 800px;
      padding: 1rem;
    }

    a {
      color: #33ff66;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 PixelQuest</h1>
    <p>A tiny retro adventure in your browser</p>
    <button class="btn" onclick="startGame()">Play Game</button>
  </header>

  <canvas id="gameCanvas" width="400" height="300"></canvas>

  <div class="section">
    <h2>About This Game</h2>
    <p>PixelQuest is a retro-style browser game in early development. Navigate the pixel world and relive the classics.</p>
    <p>Follow development or support us on <a href="#">Itch.io</a> and <a href="#">Twitter</a>.</p>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 50, y: 50, size: 16, color: '#33ff66' };
    const keys = {};

    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    function update() {
      if (keys['ArrowUp']) player.y -= 2;
      if (keys['ArrowDown']) player.y += 2;
      if (keys['ArrowLeft']) player.x -= 2;
      if (keys['ArrowRight']) player.x += 2;
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.size, player.size);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      gameLoop();
    }
  </script>
</body>
</html>
